<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Admin Dashboard</title>
</head>

<body>
    <div id="left">
        <div id="title" class="icl">
            <img src="/assets/view-dashboard.png" alt="Dashboard">
            <h1>Dashboard</h1>
        </div>
        <div id="panels">
            <div class="icl">
                <img src="/assets/home.png" alt="Home">
                <span>Home</span>
            </div>
            <div class="icl">
                <img src="/assets/card-account-details.png" alt="Profile">
                <span>Profile</span>
            </div>
            <div class="icl">
                <img src="/assets/message-reply.png" alt="Messages">
                <span>Messages</span>
            </div>
            <div class="icl">
                <img src="/assets/clock-time-three.png" alt="History">
                <span>History</span>
            </div>
            <div class="icl">
                <img src="/assets/note-multiple.png" alt="Tasks">
                <span>Tasks</span>
            </div>
            <div class="icl">
                <img src="/assets/account-group.png" alt="Communities">
                <span>Communities</span>
            </div>
        </div>
        <div id="extra">
            <div class="icl">
                <img src="/assets/cog.png" alt="Settings">
                <span>Settings</span>
            </div>
            <div class="icl">
                <img src="/assets/help-box.png" alt="Support">
                <span>Support</span>
            </div>
            <div class="icl">
                <img src="/assets/shield-check.png" alt="Privacy">
                <span>Privacy</span>
            </div>
        </div>
    </div>
    <div id="right">
        <div id="header">
            <div id="first">
                <div id="search" class="icl">
                    <img src="/assets/magnify.svg" alt="Search">
                    <input type="text" placeholder="Search...">
                </div>
                <div id="profile">
                    <img src="/assets/account.png" alt="Profile Picture">
                    <span>Admin</span>
                </div>
            </div>
            <div id="second">
                <div class="icl">
                    <img src="profile.png" alt="Profile">
                    <div class="hi">
                        <span>Hi, There</span>
                        <span>text</span>
                    </div>
                </div>
                <div id="btns">
                    <button id="btn1">New</button>
                    <button id="btn2">Upload</button>
                    <button id="btn3">Share</button>
                </div>
</body>

</html>
